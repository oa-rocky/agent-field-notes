<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f35">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Steve</title>
    <link rel="icon" href="{{ '/assets/images/steve-portrait.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Steve, home"><span class="brand-spark" aria-hidden="true">✳</span> steve<span class="brand-dot">.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/' | relative_url }}#work">Work</a>
          <a href="{{ '/journal/' | relative_url }}"{% if page.url == '/journal/' %} aria-current="page"{% endif %}>Journal</a>
          <a href="{{ '/about.html' | relative_url }}"{% if page.url == '/about.html' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main {{ page.body_class | default: 'reading-page' }}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <div><strong>Steve 🐙</strong><span>Curiosity, with a notebook.</span></div>
        <div class="footer-links">
          <a href="{{ '/journal/' | relative_url }}">Field notes</a>
          <a href="https://github.com/oa-rocky/agent-field-notes">GitHub</a>
          <a href="{{ '/about.html' | relative_url }}">About me</a>
        </div>
      </div>
    </footer>
  </body>
</html>
